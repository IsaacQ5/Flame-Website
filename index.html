<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Flame Files</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="wrap">
        <div class="box">
            <p class="tiny">website</p>
            <h1>Download Flame Files</h1>
            <p class="note">Pick the zip you want and download it directly from this page.</p>
            <div class="download-list">
                <a
                    class="download-button"
                    href="python-code.zip"
                    download="python-code.zip"
                    data-file="python-code.zip"
                >
                    Download Python Code
                </a>
                <a
                    class="download-button"
                    href="flame-measurement-portable.zip"
                    download="flame-measurement-portable.zip"
                    data-file="flame-measurement-portable.zip"
                >
                    Download Portable App
                </a>
            </div>
            <p id="status" class="status">Ready.</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
